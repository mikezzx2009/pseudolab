<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#1a2236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#6c8cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>

  <!-- decorative glow -->
  <circle cx="1040" cy="70" r="180" fill="#6c8cff" opacity="0.10"/>
  <circle cx="120" cy="360" r="160" fill="#4fd1c5" opacity="0.08"/>

  <!-- ===== editor window mock ===== -->
  <g transform="translate(56,64)">
    <rect width="620" height="272" rx="12" fill="#151b2b" stroke="#2b3754"/>
    <!-- title bar -->
    <rect width="620" height="36" rx="12" fill="#1a2236"/>
    <rect y="22" width="620" height="14" fill="#1a2236"/>
    <circle cx="20" cy="18" r="5" fill="#ff6b6b"/>
    <circle cx="38" cy="18" r="5" fill="#ffd43b"/>
    <circle cx="56" cy="18" r="5" fill="#51cf66"/>
    <text x="86" y="22" fill="#6b7c9c" font-size="12">PseudoLab — Playground</text>
    <!-- tab row -->
    <g font-size="12" font-weight="700">
      <rect x="14" y="44" width="92" height="24" rx="6" fill="#212c45"/>
      <text x="26" y="60" fill="#e6ecf6">Playground</text>
      <text x="124" y="60" fill="#9fb0cc">Learn</text>
      <text x="180" y="60" fill="#9fb0cc">Practice</text>
      <text x="252" y="60" fill="#9fb0cc">Reference</text>
    </g>
    <line x1="0" y1="78" x2="620" y2="78" stroke="#2b3754"/>
    <!-- code -->
    <g font-size="13.5">
      <!-- gutter -->
      <g fill="#52617f" text-anchor="end">
        <text x="40" y="104">1</text><text x="40" y="124">2</text><text x="40" y="144">3</text>
        <text x="40" y="164">4</text><text x="40" y="184">5</text><text x="40" y="204">6</text>
        <text x="40" y="224">7</text>
      </g>
      <g>
        <text x="56" y="104"><tspan fill="#ff8fb1" font-weight="700">FUNCTION</tspan><tspan fill="#d6a3ff"> Factorial</tspan><tspan fill="#9fb0cc">(</tspan><tspan fill="#e6ecf6">n </tspan><tspan fill="#9fb0cc">: </tspan><tspan fill="#7fd1ff">INTEGER</tspan><tspan fill="#9fb0cc">) </tspan><tspan fill="#ff8fb1" font-weight="700">RETURNS</tspan><tspan fill="#7fd1ff"> INTEGER</tspan></text>
        <text x="86" y="124"><tspan fill="#ff8fb1" font-weight="700">IF</tspan><tspan fill="#e6ecf6"> n </tspan><tspan fill="#9fb0cc">&lt;= </tspan><tspan fill="#ffcf8f">1</tspan><tspan fill="#ff8fb1" font-weight="700"> THEN</tspan></text>
        <text x="116" y="144"><tspan fill="#ff8fb1" font-weight="700">RETURN</tspan><tspan fill="#ffcf8f"> 1</tspan></text>
        <text x="86" y="164"><tspan fill="#ff8fb1" font-weight="700">ELSE</tspan></text>
        <text x="116" y="184"><tspan fill="#ff8fb1" font-weight="700">RETURN</tspan><tspan fill="#e6ecf6"> n </tspan><tspan fill="#9fb0cc">* </tspan><tspan fill="#d6a3ff">Factorial</tspan><tspan fill="#9fb0cc">(</tspan><tspan fill="#e6ecf6">n </tspan><tspan fill="#9fb0cc">- </tspan><tspan fill="#ffcf8f">1</tspan><tspan fill="#9fb0cc">)</tspan></text>
        <text x="86" y="204"><tspan fill="#ff8fb1" font-weight="700">ENDIF</tspan></text>
        <text x="56" y="224"><tspan fill="#ff8fb1" font-weight="700">ENDFUNCTION</tspan></text>
      </g>
    </g>
    <!-- output strip -->
    <line x1="0" y1="238" x2="620" y2="238" stroke="#2b3754"/>
    <text x="16" y="259" font-size="12.5"><tspan fill="#52617f">&#9656; OUTPUT Factorial(5)  </tspan><tspan fill="#b6e3a8">120</tspan></text>
  </g>

  <!-- ===== title block ===== -->
  <g transform="translate(724,96)">
    <rect width="46" height="46" rx="11" fill="url(#accent)"/>
    <text x="23" y="34" text-anchor="middle" font-size="26" font-weight="800" fill="#08111f">P</text>
    <text x="62" y="36" font-size="40" font-weight="800" fill="#e6ecf6" font-family="-apple-system, Segoe UI, Roboto, sans-serif">PseudoLab</text>

    <text x="2" y="86" font-size="17" fill="#9fb0cc" font-family="-apple-system, Segoe UI, Roboto, sans-serif">Write, run &amp; master Cambridge 9618 pseudocode</text>
    <text x="2" y="110" font-size="17" fill="#9fb0cc" font-family="-apple-system, Segoe UI, Roboto, sans-serif">— in one offline HTML file.</text>

    <!-- chips -->
    <g font-size="13" font-weight="700" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
      <g transform="translate(0,140)">
        <rect width="150" height="30" rx="15" fill="#212c45" stroke="#2b3754"/>
        <text x="75" y="20" text-anchor="middle" fill="#4fd1c5">Real interpreter</text>
      </g>
      <g transform="translate(162,140)">
        <rect width="118" height="30" rx="15" fill="#212c45" stroke="#2b3754"/>
        <text x="59" y="20" text-anchor="middle" fill="#7fd1ff">Zero deps</text>
      </g>
      <g transform="translate(292,140)">
        <rect width="150" height="30" rx="15" fill="#212c45" stroke="#2b3754"/>
        <text x="75" y="20" text-anchor="middle" fill="#d6a3ff">Auto-graded drills</text>
      </g>
      <g transform="translate(0,182)">
        <rect width="132" height="30" rx="15" fill="#212c45" stroke="#2b3754"/>
        <text x="66" y="20" text-anchor="middle" fill="#ffcf8f">AS &amp; A2 lessons</text>
      </g>
      <g transform="translate(144,182)">
        <rect width="146" height="30" rx="15" fill="#212c45" stroke="#2b3754"/>
        <text x="73" y="20" text-anchor="middle" fill="#b6e3a8">Works offline</text>
      </g>
    </g>
  </g>
</svg>
