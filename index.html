<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PseudoLab — CIE Pseudocode Editor & Trainer</title>
<style>
/* ===================== PseudoLab styles ===================== */
:root {
  --bg: #0f1420;
  --bg-2: #151b2b;
  --panel: #1a2236;
  --panel-2: #212c45;
  --border: #2b3754;
  --text: #e6ecf6;
  --text-dim: #9fb0cc;
  --text-faint: #6b7c9c;
  --accent: #4fd1c5;
  --accent-2: #6c8cff;
  --green: #51cf66;
  --red: #ff6b6b;
  --amber: #ffd43b;
  --kw: #ff8fb1;
  --type: #7fd1ff;
  --str: #b6e3a8;
  --num: #ffcf8f;
  --comment: #6b7c9c;
  --fn: #d6a3ff;
  --op: #9fb0cc;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
}
[data-theme="light"] {
  --bg: #eef1f7;
  --bg-2: #e3e8f2;
  --panel: #ffffff;
  --panel-2: #f3f6fc;
  --border: #d3dbea;
  --text: #1a2236;
  --text-dim: #4b5b78;
  --text-faint: #8190ad;
  --accent: #0d9488;
  --accent-2: #3b5bdb;
  --kw: #c2185b;
  --type: #0277bd;
  --str: #2e7d32;
  --num: #b5670f;
  --comment: #8190ad;
  --fn: #7b3ff2;
  --op: #4b5b78;
  --shadow: 0 6px 24px rgba(40,60,100,.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
::selection { background: rgba(108,140,255,.35); }

/* layout */
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 0 18px; height: 56px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand .logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #0b1020; font-weight: 800; font-size: 15px;
}
.brand small { color: var(--text-faint); font-weight: 500; font-size: 11px; }

.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab {
  background: transparent; border: none; color: var(--text-dim);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px;
}
.tab:hover { background: var(--panel); color: var(--text); }
.tab.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }

.spacer { flex: 1; }
.icon-btn {
  background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
  width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px;
}
.icon-btn:hover { color: var(--text); }

.view { flex: 1; overflow: hidden; display: none; }
.view.active { display: flex; }

/* ---------- editor widget ---------- */
.editor-shell { display: flex; flex-direction: column; min-height: 0; }
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
}
.btn:hover { border-color: var(--accent-2); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #08111f; border: none; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.green { background: var(--green); color: #08220f; border: none; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
select.btn { -webkit-appearance: none; appearance: none; padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.editor {
  display: flex; min-height: 0; flex: 1;
  background: var(--panel); position: relative; overflow: hidden;
}
.gutter {
  flex-shrink: 0; width: 52px; padding: 12px 8px 12px 0;
  text-align: right; color: var(--text-faint);
  font-family: var(--mono); font-size: 13px; line-height: 1.55;
  background: var(--bg-2); border-right: 1px solid var(--border);
  overflow: hidden; user-select: none; white-space: pre;
}
.code-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code-wrap pre.hl, .code-wrap textarea {
  margin: 0; position: absolute; inset: 0;
  padding: 12px 14px;
  font-family: var(--mono); font-size: 13px; line-height: 1.55;
  white-space: pre; tab-size: 3; -moz-tab-size: 3;
  border: 0; overflow: auto;
}
.code-wrap pre.hl { color: var(--text); pointer-events: none; z-index: 1; }
.code-wrap textarea {
  z-index: 2; background: transparent; color: transparent; caret-color: var(--accent);
  resize: none; outline: none;
}
.code-wrap textarea::placeholder { color: var(--text-faint); }

/* syntax colors */
.t-kw { color: var(--kw); font-weight: 600; }
.t-type { color: var(--type); }
.t-str { color: var(--str); }
.t-num { color: var(--num); }
.t-com { color: var(--comment); font-style: italic; }
.t-fn { color: var(--fn); }
.t-op { color: var(--op); }
.t-bool { color: var(--num); font-weight: 600; }

/* ---------- editor view split ---------- */
#view-editor { width: 100%; }
.split { display: flex; width: 100%; min-height: 0; }
.split .left { flex: 1.4; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
.split .right { flex: 1; display: flex; flex-direction: column; min-width: 320px; }

.io-tabs { display: flex; gap: 4px; padding: 8px 10px; background: var(--bg-2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.io-tab { background: transparent; border: none; color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.io-tab.active { background: var(--panel-2); color: var(--text); }
.io-panel { flex: 1; min-height: 0; overflow: auto; display: none; flex-direction: column; }
.io-panel.active { display: flex; }

.console {
  flex: 1; margin: 0; padding: 14px 16px; overflow: auto;
  font-family: var(--mono); font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  background: var(--panel);
}
.console .ln-out { color: var(--text); }
.console .ln-err { color: var(--red); }
.console .ln-info { color: var(--text-faint); font-style: italic; }
.console .ln-prompt { color: var(--accent); }
.console:empty::before { content: "Output appears here. Press Run ▶ or Ctrl/⌘+Enter."; color: var(--text-faint); font-style: italic; }

.io-area {
  flex: 1; width: 100%; border: 0; resize: none; outline: none;
  background: var(--panel); color: var(--text);
  font-family: var(--mono); font-size: 13px; line-height: 1.55; padding: 12px 14px;
}
.io-hint { padding: 8px 14px; color: var(--text-faint); font-size: 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); }

/* ---------- learn / practice layout ---------- */
.with-sidebar { display: flex; width: 100%; min-height: 0; }
.sidebar {
  width: 290px; flex-shrink: 0; border-right: 1px solid var(--border);
  background: var(--bg-2); overflow: auto; padding: 12px;
}
.level-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--panel); color: var(--text-dim);
  padding: 5px 11px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.chip.active { background: var(--accent-2); color: #08111f; border-color: transparent; }

.lesson-group { margin-bottom: 14px; }
.lesson-group h4 {
  margin: 6px 4px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint);
}
.nav-item {
  padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text-dim);
  font-size: 13px; margin-bottom: 3px; border: 1px solid transparent;
}
.nav-item:hover { background: var(--panel); color: var(--text); }
.nav-item.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
.nav-item .topic { display: block; font-size: 11px; color: var(--text-faint); }
.nav-item .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--panel); margin-left: 6px; }
.nav-item.done .topic::after { content: " ✓ solved"; color: var(--green); }

.content-pane { flex: 1; overflow: auto; min-width: 0; }
.content-inner { max-width: 860px; margin: 0 auto; padding: 28px 34px 60px; }
.content-inner h1 { font-size: 24px; margin: 0 0 4px; }
.content-inner .eyebrow { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.content-inner h2 { font-size: 18px; margin-top: 28px; }
.lesson-body p { color: var(--text); }
.lesson-body ul { color: var(--text); padding-left: 22px; }
.lesson-body li { margin: 4px 0; }
.lesson-body code { background: var(--bg-2); padding: 1.5px 6px; border-radius: 5px; font-family: var(--mono); font-size: 12.5px; color: var(--type); }
.lesson-body pre.syntax {
  background: var(--bg-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  padding: 12px 14px; border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: 12.5px; color: var(--text);
}
.lesson-body .tip {
  background: rgba(79,209,197,.08); border: 1px solid rgba(79,209,197,.3);
  border-radius: 8px; padding: 10px 14px; margin: 16px 0; color: var(--text); font-size: 13px;
}
.lesson-body .tip code { background: rgba(0,0,0,.2); }

.example-card { margin-top: 22px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.example-card .ec-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; background: var(--bg-2); border-bottom: 1px solid var(--border); }
.example-card .ec-head span { font-weight: 600; font-size: 12px; color: var(--text-dim); }
.example-card pre.code-block { margin: 0; padding: 14px 16px; overflow: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; background: var(--panel); white-space: pre; }

/* practice specifics */
.q-prompt { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
.q-prompt p { margin: 6px 0; }
.q-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.q-meta .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); color: var(--text-dim); font-weight: 600; }
.practice-editor-wrap { display: flex; flex-direction: column; height: 340px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.grade-result { margin-top: 14px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); display: none; }
.grade-result.show { display: block; }
.grade-banner { padding: 12px 16px; font-weight: 700; }
.grade-banner.ok { background: rgba(81,207,102,.14); color: var(--green); }
.grade-banner.bad { background: rgba(255,107,107,.12); color: var(--red); }
.grade-cases { padding: 10px 16px; background: var(--panel); }
.case-row { display: flex; gap: 10px; align-items: baseline; font-family: var(--mono); font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.case-row:last-child { border-bottom: none; }
.case-row .res-ok { color: var(--green); } .case-row .res-bad { color: var(--red); }
.diff-box { margin-top: 8px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.diff-box .lbl { color: var(--text-faint); }
.hint-box, .solution-box { margin-top: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: none; }
.hint-box.show, .solution-box.show { display: block; }
.solution-box pre { margin: 8px 0 0; font-family: var(--mono); font-size: 12.5px; white-space: pre; overflow: auto; }

/* reference */
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
.ref-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.ref-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
.ref-card table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ref-card td { padding: 4px 6px; vertical-align: top; border-bottom: 1px solid var(--border); }
.ref-card td:first-child { font-family: var(--mono); color: var(--type); white-space: nowrap; }
.ref-card tr:last-child td { border-bottom: none; }

.empty-state { color: var(--text-faint); text-align: center; padding: 60px 20px; }

/* scrollbars */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 820px) {
  .split { flex-direction: column; }
  .split .left { border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar { width: 220px; }
  .tabs .tab { padding: 8px 9px; }
}

</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">P</div>
      <div>PseudoLab <small>Cambridge AS &amp; A Level 9618 · pseudocode</small></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="editor">Playground</button>
      <button class="tab" data-view="learn">Learn</button>
      <button class="tab" data-view="practice">Practice</button>
      <button class="tab" data-view="reference">Reference</button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeToggle" title="Toggle light / dark">◐</button>
  </div>
  <div class="view active" id="view-editor"></div>
  <div class="view" id="view-learn"></div>
  <div class="view" id="view-practice"></div>
  <div class="view" id="view-reference"></div>
</div>
<script>
/* ============================================================================
 * PseudoLab Engine
 * A tree-walking interpreter for Cambridge (CIE) pseudocode.
 * Targets Cambridge International AS & A Level Computer Science (9618)
 * pseudocode, with a few lenient extras so most exam-style code runs.
 *
 * Works in both the browser (attaches to window.PseudoEngine) and Node
 * (module.exports) so the same source can be unit-tested.
 * ==========================================================================*/
(function (global) {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Errors
   * ------------------------------------------------------------------ */
  function PseudoError(message, line) {
    this.name = 'PseudoError';
    this.message = message;
    this.line = line || null;
  }
  PseudoError.prototype = Object.create(Error.prototype);

  function err(msg, line) { throw new PseudoError(msg, line); }

  /* ------------------------------------------------------------------ *
   * Character normalisation
   * Exam PDFs use typographic characters; map them to ASCII equivalents.
   * ------------------------------------------------------------------ */
  function normalizeSource(src) {
    return src
      .replace(/←/g, '<-')   // ← assignment
      .replace(/[−–—]/g, '-') // minus sign / en / em dash
      .replace(/×/g, '*')   // ×
      .replace(/÷/g, '/')   // ÷
      .replace(/≤/g, '<=')  // ≤
      .replace(/≥/g, '>=')  // ≥
      .replace(/≠/g, '<>')  // ≠
      .replace(/[“”]/g, '"')          // “ ”
      .replace(/[‘’Ꞌꞌ]/g, "'") // ‘ ’ saltillo
      .replace(/ /g, ' ')   // non-breaking space
      .replace(/\t/g, '   ');    // tabs -> 3 spaces
  }

  /* ------------------------------------------------------------------ *
   * Lexer
   * ------------------------------------------------------------------ */
  var KEYWORDS = {};
  ['DECLARE','CONSTANT','ARRAY','OF',
   'INTEGER','REAL','CHAR','STRING','BOOLEAN','DATE',
   'IF','THEN','ELSE','ENDIF',
   'CASE','OTHERWISE','ENDCASE',
   'FOR','TO','STEP','NEXT',
   'WHILE','DO','ENDWHILE',
   'REPEAT','UNTIL',
   'PROCEDURE','ENDPROCEDURE','FUNCTION','RETURNS','RETURN','ENDFUNCTION','CALL','BYREF','BYVAL',
   'INPUT','OUTPUT','PRINT',
   'TYPE','ENDTYPE','SET','DEFINE',
   'DIV','MOD','AND','OR','NOT',
   'OPENFILE','READFILE','WRITEFILE','CLOSEFILE','SEEK','GETRECORD','PUTRECORD',
   'CLASS','ENDCLASS','INHERITS','PUBLIC','PRIVATE','NEW','SUPER'
  ].forEach(function (k) { KEYWORDS[k] = true; });

  function tokenize(src) {
    var s = normalizeSource(src);
    var tokens = [];
    var i = 0, line = 1, n = s.length;
    var depth = 0; // () and [] nesting -> suppress NL so statements can wrap

    function push(type, value) { tokens.push({ type: type, value: value, line: line }); }

    while (i < n) {
      var c = s[i];

      // newline
      if (c === '\n') {
        if (depth <= 0) {
          // collapse consecutive newlines into one NL token
          if (tokens.length && tokens[tokens.length - 1].type !== 'NL') push('NL', '\n');
        }
        line++; i++; continue;
      }
      if (c === '\r') { i++; continue; }
      if (c === ' ') { i++; continue; }

      // comment //...
      if (c === '/' && s[i + 1] === '/') {
        while (i < n && s[i] !== '\n') i++;
        continue;
      }

      // string literal
      if (c === '"') {
        var str = ''; i++;
        while (i < n && s[i] !== '"' && s[i] !== '\n') { str += s[i]; i++; }
        if (s[i] !== '"') err('Unterminated string literal', line);
        i++; push('STR', str); continue;
      }

      // char literal
      if (c === "'") {
        i++;
        var ch = '';
        while (i < n && s[i] !== "'" && s[i] !== '\n') { ch += s[i]; i++; }
        if (s[i] !== "'") err('Unterminated character literal', line);
        i++;
        push('CHAR', ch); continue;
      }

      // number
      if (c >= '0' && c <= '9') {
        var num = '';
        while (i < n && s[i] >= '0' && s[i] <= '9') { num += s[i]; i++; }
        if (s[i] === '.' && s[i + 1] >= '0' && s[i + 1] <= '9') {
          num += '.'; i++;
          while (i < n && s[i] >= '0' && s[i] <= '9') { num += s[i]; i++; }
          push('REAL', parseFloat(num));
        } else {
          push('INT', parseInt(num, 10));
        }
        continue;
      }

      // identifier / keyword
      if (/[A-Za-z_]/.test(c)) {
        var word = '';
        while (i < n && /[A-Za-z0-9_]/.test(s[i])) { word += s[i]; i++; }
        var up = word.toUpperCase();
        if (up === 'TRUE') { push('BOOL', true); }
        else if (up === 'FALSE') { push('BOOL', false); }
        else if (KEYWORDS[up]) { push('KW', up); }
        else { push('IDENT', word); }
        continue;
      }

      // multi-char operators
      var two = s.substr(i, 2);
      if (two === '<-') {
        if (s[i + 2] === '-') { push('ASSIGN', '<--'); i += 3; }
        else { push('ASSIGN', '<-'); i += 2; }
        continue;
      }
      if (two === '<=') { push('<=', two); i += 2; continue; }
      if (two === '>=') { push('>=', two); i += 2; continue; }
      if (two === '<>') { push('<>', two); i += 2; continue; }

      // single-char tokens
      switch (c) {
        case '(': depth++; push('(', c); i++; continue;
        case ')': depth--; push(')', c); i++; continue;
        case '[': depth++; push('[', c); i++; continue;
        case ']': depth--; push(']', c); i++; continue;
        case '+': case '-': case '*': case '/':
          push(c, c); i++; continue;
        case '=': push('=', c); i++; continue;
        case '<': push('<', c); i++; continue;
        case '>': push('>', c); i++; continue;
        case '&': push('&', c); i++; continue;
        case '^': push('^', c); i++; continue;
        case ',': push(',', c); i++; continue;
        case ':': push(':', c); i++; continue;
        case '.': push('.', c); i++; continue;
      }
      err("Unexpected character '" + c + "'", line);
    }
    push('NL', '\n');
    push('EOF', null);
    return tokens;
  }

  /* ------------------------------------------------------------------ *
   * Parser  (recursive descent -> AST of plain objects)
   * ------------------------------------------------------------------ */
  function Parser(tokens) {
    this.toks = tokens;
    this.p = 0;
  }
  Parser.prototype.peek = function (k) { return this.toks[this.p + (k || 0)]; };
  Parser.prototype.next = function () { return this.toks[this.p++]; };
  Parser.prototype.atEnd = function () { return this.peek().type === 'EOF'; };
  Parser.prototype.is = function (type) { return this.peek().type === type; };
  Parser.prototype.isKw = function (w) { var t = this.peek(); return t.type === 'KW' && t.value === w; };
  Parser.prototype.line = function () { return this.peek().line; };
  Parser.prototype.eat = function (type) {
    if (this.peek().type !== type) err("Expected '" + type + "' but found '" + this.describe(this.peek()) + "'", this.line());
    return this.next();
  };
  Parser.prototype.eatKw = function (w) {
    if (!this.isKw(w)) err("Expected '" + w + "' but found '" + this.describe(this.peek()) + "'", this.line());
    return this.next();
  };
  Parser.prototype.describe = function (t) {
    if (!t) return 'EOF';

    }

        case 'IF': return this.parseIf();
        case 'CASE': return this.parseCase();
        case 'FOR': return this.parseFor();
        case 'WHILE': return this.parseWhile();
        case 'REPEAT': return this.parseRepeat();
        case 'PROCEDURE': return this.parseProcedure(null);
        case 'FUNCTION': return this.parseFunction(null);
        case 'CALL': return this.parseCall();
        case 'RETURN': return this.parseReturn();
        case 'INPUT': return this.parseInput();
        case 'OUTPUT': case 'PRINT': return this.parseOutput();
        case 'TYPE': return this.parseType();
        case 'DEFINE': return this.parseDefine();
        case 'CLASS': return this.parseClass();

        if (cell) return cell.value;
        // implicit "this" field access inside a method
        if (scope.thisObj && scope.thisObj.value.fields.hasOwnProperty(node.name.toLowerCase()))
          return scope.thisObj.value.fields[node.name.toLowerCase()];

        err("Variable '" + node.name + "' is used before it is declared/assigned", node.line);
        break;
      }
      case 'BinOp': return this.evalBinOp(node, scope);
      case 'Unary': return this.evalUnary(node, scope);
      case 'Index': {
        var tval = this.eval(node.target, scope);
        if (tval && tval.type === 'STRING') {
          if (node.indices.length !== 1) err('A string is indexed with a single position', node.line);
          var p = this.toInt(this.eval(node.indices[0], scope), node.line);
          if (p < 1 || p > tval.value.length) err('String position ' + p + ' is out of range (1:' + tval.value.length + ')', node.line);

          for (var ii = 0; ii < node.indices.length; ii++) idx.push(this.toInt(this.eval(node.indices[ii], scope), node.line));

      case 'MethodCall': return this.evalMethodCall(node, scope);
      case 'New': return this.evalNew(node, scope);
      case 'SuperCall': return this.evalSuper(node, scope);
      case 'ArrayLit': {

  Interpreter.prototype.evalUnary = function (node, scope) {

    if (op === 'OR') return mkBool(this.asBool(this.eval(node.left, scope), node.line) || this.asBool(this.eval(node.right, scope), node.line));

      case '<>': return mkBool(!this.valueEquals(l, r));

      case '>': return mkBool(this.compare(l, r) > 0);

  Interpreter.prototype.numCheck = function (l, r, op, line) {

      case 'TO_UPPER': { need(1); var v2b = arg(0); return v2b.type === 'CHAR' ? mkChar(self.toStr(v2b).toUpperCase()) : mkStr(self.toStr(v2b).toUpperCase()); }
      case 'TO_LOWER': { need(1); var v2c = arg(0); return v2c.type === 'CHAR' ? mkChar(self.toStr(v2c).toLowerCase()) : mkStr(self.toStr(v2c).toLowerCase()); }

      case 'MOD': { need(2); return mkInt(self.toNum(arg(0), line) % self.toNum(arg(1), line)); }

  /* ---- OOP ---- */
  Interpreter.prototype.evalNew = function (node, scope) {

  Interpreter.prototype.initClassFields = function (cls, obj, scope, line) {

  Interpreter.prototype.evalMethodCall = function (node, scope) {

    if (!m) err("Method '" + node.method + "' not found on class " + obj.value.className, node.line);
    return this.invokeMethod(m.def, m.cls, node.args, scope, node.line, obj);
  };
  Interpreter.prototype.invokeMethod = function (def, cls, argNodes, callerScope, line, obj) {
    if (++this.callDepth > this.maxDepth) { this.callDepth--; err('Maximum recursion depth exceeded', line); }
    var fnScope = new Scope(this.global);
    fnScope.thisObj = obj;
    fnScope.currentClass = cls;
    var params = def.params || [];
    if (argNodes.length !== params.length) { this.callDepth--; err("Method '" + def.name + "' expects " + params.length + ' argument(s)', line); }
    for (var i = 0; i < params.length; i++) {

  };
  Interpreter.prototype.evalSuper = function (node, scope) {
    var obj = scope.thisObj;
    var cls = scope.currentClass;
    if (!obj || !cls || !cls.parent) err('SUPER can only be used inside a subclass method', node.line);

    if (!m) err("SUPER has no method '" + node.method + "'", node.line);
    return this.invokeMethod(m.def, m.cls, node.args, scope, node.line, obj);
  };

  /* ---- conversions ---- */
  Interpreter.prototype.asBool = function (v, line) {
    if (v.type === 'BOOLEAN') return v.value;
    err('Expected a BOOLEAN value (TRUE/FALSE)', line);
  };
  Interpreter.prototype.toInt = function (v, line) {
    if (v.type === 'INTEGER') return v.value;
    if (v.type === 'REAL') { if (Number.isInteger(v.value)) return v.value; return Math.trunc(v.value); }
    if (v.type === 'STRING' && /^-?\d+$/.test(v.value.trim())) return parseInt(v.value, 10);
    err('Expected an INTEGER value', line);
  };
  Interpreter.prototype.toNum = function (v, line) {
    if (isNum(v)) return v.value;
    if (v.type === 'STRING' && v.value.trim() !== '' && !isNaN(Number(v.value))) return Number(v.value);

  };

    if (v == null) return '';

      case 'STRING': case 'CHAR': return v.value;
      case 'INTEGER': return String(v.value);
      case 'REAL': return fmtReal(v.value);
      case 'BOOLEAN': return v.value ? 'TRUE' : 'FALSE';
      case 'ENUM': return v.value ? v.value.name : 'NULL';
      case 'DATE': return v.value || '';
      case 'POINTER': return v.value ? '<pointer>' : 'NULL';
      case 'OBJECT': return v.value ? '<' + v.value.className + '>' : 'NULL';

    if (!isFinite(n)) return String(n);
    if (Number.isInteger(n)) return String(n);

(function (global) {

    {

        '<li><strong>Algorithmic thinking</strong> — design clear step-by-step instructions.</li></ul>' +
        '<p>An <strong>algorithm</strong> is a sequence of defined steps that performs a task. Algorithms can be expressed as <em>structured English</em>, a <em>flowchart</em>, or <em>pseudocode</em>. This course (and the exam) uses pseudocode.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> A good algorithm is correct, finite (it ends), unambiguous, and works for every valid input — including edge cases.</div>',
      example:
        '// Algorithm: report the largest of three numbers\nDECLARE a : INTEGER\nDECLARE b : INTEGER\nDECLARE c : INTEGER\na <- 14\nb <- 9\nc <- 21\nIF a >= b AND a >= c THEN\n   OUTPUT "Largest is ", a\nELSE\n   IF b >= c THEN\n      OUTPUT "Largest is ", b\n   ELSE\n      OUTPUT "Largest is ", c\n   ENDIF\nENDIF'

        '<ul><li><code>INTEGER</code> — whole number, e.g. 5, -3</li>' +
        '<li><code>REAL</code> — has a fractional part, written with a decimal point, e.g. 4.7, -4.0</li>' +

      title: 'Selection: IF and CASE',
      html:
        '<p><code>IF</code> chooses between paths. Use <code>CASE OF</code> when one variable is tested against several discrete values.</p>' +
        '<pre class="syntax">IF &lt;condition&gt; THEN\n   &lt;statements&gt;\nELSE\n   &lt;statements&gt;\nENDIF\n\nCASE OF &lt;variable&gt;\n   &lt;value1&gt; : &lt;statement(s)&gt;\n   &lt;value2&gt; TO &lt;value3&gt; : &lt;statement(s)&gt;\n   OTHERWISE : &lt;statement(s)&gt;\nENDCASE</pre>' +
        '<div class="tip"><strong>Exam tip:</strong> CASE clauses are tested in order; the first match runs and the rest are skipped. A value can be a range (<code>1 TO 49</code>). Put <code>OTHERWISE</code> last.</div>',
      example:
        'DECLARE Mark : INTEGER\nMark <- 72\nCASE OF Mark\n   80 TO 100 : OUTPUT "A"\n   70 TO 79  : OUTPUT "B"\n   60 TO 69  : OUTPUT "C"\n   OTHERWISE : OUTPUT "Below C"\nENDCASE'
    },
    {
      id: 'as-iter', level: 'AS', topic: 'Ch 12 / 14 · Iteration',
      title: 'Iteration: FOR, WHILE, REPEAT',
      html:
        '<p>Three loop constructs — know exactly when each is appropriate:</p>' +
        '<ul><li><strong>Count-controlled</strong> <code>FOR … NEXT</code> — when the number of repetitions is known. <code>STEP</code> may be negative.</li>' +
        '<li><strong>Pre-condition</strong> <code>WHILE … ENDWHILE</code> — test <em>before</em>; may run zero times.</li>' +
        '<li><strong>Post-condition</strong> <code>REPEAT … UNTIL</code> — test <em>after</em>; always runs at least once.</li></ul>' +
        '<pre class="syntax">FOR i &lt;- 1 TO 10 STEP 1\n   &lt;statements&gt;\nNEXT i\n\nWHILE &lt;condition&gt;\n   &lt;statements&gt;\nENDWHILE\n\nREPEAT\n   &lt;statements&gt;\nUNTIL &lt;condition&gt;</pre>' +
        '<div class="tip"><strong>Exam tip:</strong> Use <code>REPEAT</code> for input validation — you must ask at least once. Use a <code>WHILE</code> loop when the loop might not run at all.</div>',
      example:
        'DECLARE Total : INTEGER\nDECLARE i : INTEGER\nTotal <- 0\nFOR i <- 1 TO 10\n   Total <- Total + i\nNEXT i\nOUTPUT "Sum 1..10 = ", Total\n\nDECLARE n : INTEGER\nn <- 100\nWHILE n > 1\n   n <- n DIV 2\nENDWHILE\nOUTPUT "Halved down to ", n'
    },
    {
      id: 'as-stdalg', level: 'AS', topic: 'Ch 12 · Standard Methods',
      title: 'Standard Algorithms & Trace Tables',
      html:
        '<p>Examiners expect fluency with these reusable patterns:</p>' +
        '<ul><li><strong>Totalling</strong> — keep a running <code>Total</code>.</li>' +
        '<li><strong>Counting</strong> — increment a <code>Count</code> when a condition is met.</li>' +
        '<li><strong>Maximum / minimum</strong> — assume the first value, then compare the rest.</li>' +
        '<li><strong>Average</strong> — total &divide; count.</li>' +
        '<li><strong>Rogue value (sentinel)</strong> — a special value that ends input, e.g. <code>-1</code>.</li></ul>' +
        '<p>A <strong>trace table</strong> records the value of each variable after every step — the key technique for dry-running and debugging an algorithm by hand.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> The sentinel itself must <em>not</em> be processed — test for it before using the value.</div>',
      example:
        '// Total and count values until the rogue value -1 is reached\nDECLARE Data : ARRAY[1:6] OF INTEGER\nDECLARE Total : INTEGER\nDECLARE Count : INTEGER\nDECLARE i : INTEGER\nData[1] <- 7\nData[2] <- 3\nData[3] <- 10\nData[4] <- 5\nData[5] <- -1     // rogue value marks the end\nTotal <- 0\nCount <- 0\ni <- 1\nWHILE Data[i] <> -1\n   Total <- Total + Data[i]\n   Count <- Count + 1\n   i <- i + 1\nENDWHILE\nOUTPUT "Count = ", Count\nOUTPUT "Total = ", Total\nOUTPUT "Average = ", Total / Count'
    },
    {
      id: 'as-1d', level: 'AS', topic: 'Ch 13 · Data Structures',
      title: 'One-Dimensional Arrays',
      html:
        '<p>An array is a fixed-length collection of elements of the <em>same</em> type, reached by an index.</p>' +
        '<pre class="syntax">DECLARE &lt;identifier&gt; : ARRAY[&lt;lower&gt;:&lt;upper&gt;] OF &lt;type&gt;</pre>' +
        '<p>Cambridge arrays normally start at index <strong>1</strong>. Pair every array with a <code>FOR</code> loop to read, search, total or print all its elements.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> State the bounds explicitly. <code>ARRAY[1:30]</code> has 30 elements indexed 1 to 30.</div>',
      example:
        'DECLARE Scores : ARRAY[1:5] OF INTEGER\nDECLARE i : INTEGER\nDECLARE Total : INTEGER\nScores[1] <- 8\nScores[2] <- 5\nScores[3] <- 9\nScores[4] <- 4\nScores[5] <- 7\nTotal <- 0\nFOR i <- 1 TO 5\n   Total <- Total + Scores[i]\nNEXT i\nOUTPUT "Average score = ", Total / 5'
    },
    {
      id: 'as-2d', level: 'AS', topic: 'Ch 13 · Data Structures',
      title: 'Two-Dimensional Arrays',
      html:
        '<p>A 2-D array models a table or grid. The first index is usually the <em>row</em>, the second the <em>column</em>.</p>' +
        '<pre class="syntax">DECLARE &lt;identifier&gt; : ARRAY[&lt;l1&gt;:&lt;u1&gt;, &lt;l2&gt;:&lt;u2&gt;] OF &lt;type&gt;</pre>' +
        '<p>Process a 2-D array with <strong>nested</strong> <code>FOR</code> loops — the outer loop for rows, the inner for columns.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Keep your index order consistent: <code>Grid[Row, Col]</code> everywhere.</div>',
      example:
        'DECLARE Grid : ARRAY[1:2, 1:3] OF INTEGER\nDECLARE r : INTEGER\nDECLARE c : INTEGER\nDECLARE v : INTEGER\nv <- 1\nFOR r <- 1 TO 2\n   FOR c <- 1 TO 3\n      Grid[r, c] <- v\n      v <- v + 1\n   NEXT c\nNEXT r\nFOR r <- 1 TO 2\n   OUTPUT Grid[r,1], " ", Grid[r,2], " ", Grid[r,3]\nNEXT r'
    },
    {
      id: 'as-searchsort', level: 'AS', topic: 'Ch 13 · Searching & Sorting',
      title: 'Linear Search & Bubble Sort',
      html:
        '<p>Two standard algorithms you must be able to write and trace.</p>' +
        '<p><strong>Linear search:</strong> examine each element in turn until the target is found or the array ends. Use a BOOLEAN flag to record success.</p>' +
        '<p><strong>Bubble sort:</strong> repeatedly compare adjacent pairs and swap them if out of order; the largest value "bubbles" to the end each pass.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> An efficient bubble sort stops early if a complete pass makes no swaps (the data is already sorted).</div>',
      example:
        'DECLARE A : ARRAY[1:6] OF INTEGER\nDECLARE i : INTEGER\nDECLARE j : INTEGER\nDECLARE temp : INTEGER\nA[1]<-5\nA[2]<-1\nA[3]<-4\nA[4]<-2\nA[5]<-8\nA[6]<-3\nFOR i <- 1 TO 5\n   FOR j <- 1 TO 6 - i\n      IF A[j] > A[j+1] THEN\n         temp <- A[j]\n         A[j] <- A[j+1]\n         A[j+1] <- temp\n      ENDIF\n   NEXT j\nNEXT i\nFOR i <- 1 TO 6\n   OUTPUT A[i]\nNEXT i'
    },
    {
      id: 'as-records', level: 'AS', topic: 'Ch 13 · Data Structures',
      title: 'The Record Type',
      html:
        '<p>A <strong>record</strong> groups related fields of (possibly) different types under one type name. Define it with <code>TYPE … ENDTYPE</code>, then declare variables of that type and use dot notation.</p>' +
        '<pre class="syntax">TYPE &lt;TypeName&gt;\n   DECLARE &lt;field&gt; : &lt;type&gt;\n   DECLARE &lt;field&gt; : &lt;type&gt;\nENDTYPE</pre>' +
        '<div class="tip"><strong>Exam tip:</strong> Records and arrays combine powerfully: <code>ARRAY[1:30] OF StudentRecord</code> models a whole form. Access it as <code>Form[i].Name</code>.</div>',
      example:
        'TYPE StudentRecord\n   DECLARE Name : STRING\n   DECLARE YearGroup : INTEGER\nENDTYPE\n\nDECLARE Form : ARRAY[1:3] OF StudentRecord\nForm[1].Name <- "Ada"\nForm[1].YearGroup <- 12\nForm[2].Name <- "Bo"\nForm[2].YearGroup <- 13\nForm[3].Name <- "Cara"\nForm[3].YearGroup <- 12\nDECLARE i : INTEGER\nFOR i <- 1 TO 3\n   OUTPUT Form[i].Name, " is in year ", Form[i].YearGroup\nNEXT i'
    },
    {
      id: 'as-files', level: 'AS', topic: 'Ch 13 / 14 · Files',
      title: 'Text Files',
      html:
        '<p>Text files store lines of characters read or written one line at a time. Open in a mode, do the I/O, then close.</p>' +
        '<pre class="syntax">OPENFILE "name" FOR READ | WRITE | APPEND\nREADFILE "name", &lt;stringVariable&gt;\nWRITEFILE "name", &lt;data&gt;\nCLOSEFILE "name"</pre>' +
        '<p><code>EOF("name")</code> returns <code>TRUE</code> when there are no more lines to read. <code>WRITE</code> starts a new file; <code>APPEND</code> adds to the end of an existing one.</p>' +
        '<div class="tip"><strong>In this editor:</strong> files live in memory for one run. Use the <strong>Files</strong> panel to pre-load a file before reading it, or <code>WRITE</code> one earlier in the same program.</div>',
      example:
        'OPENFILE "names.txt" FOR WRITE\nWRITEFILE "names.txt", "Ada"\nWRITEFILE "names.txt", "Bo"\nWRITEFILE "names.txt", "Cara"\nCLOSEFILE "names.txt"\n\nDECLARE line : STRING\nDECLARE count : INTEGER\ncount <- 0\nOPENFILE "names.txt" FOR READ\nWHILE NOT EOF("names.txt")\n   READFILE "names.txt", line\n   count <- count + 1\n   OUTPUT count, ": ", line\nENDWHILE\nCLOSEFILE "names.txt"'
    },
    {
      id: 'as-subs', level: 'AS', topic: 'Ch 14 · Subroutines',
      title: 'Procedures & Functions',
      html:
        '<p>Subroutines support decomposition. A <strong>procedure</strong> performs a task; a <strong>function</strong> performs a task and <code>RETURN</code>s a single value used in an expression.</p>' +
        '<pre class="syntax">PROCEDURE &lt;name&gt;(&lt;param&gt; : &lt;type&gt;)\n   &lt;statements&gt;\nENDPROCEDURE\nCALL &lt;name&gt;(&lt;args&gt;)\n\nFUNCTION &lt;name&gt;(&lt;param&gt; : &lt;type&gt;) RETURNS &lt;type&gt;\n   RETURN &lt;value&gt;\nENDFUNCTION</pre>' +
        '<div class="tip"><strong>Exam tip:</strong> Call a procedure with <code>CALL</code>. Never use <code>CALL</code> for a function — a function call appears inside an expression. Executing <code>RETURN</code> exits the function immediately.</div>',
      example:
        'FUNCTION IsEven(n : INTEGER) RETURNS BOOLEAN\n   RETURN (n MOD 2 = 0)\nENDFUNCTION\n\nPROCEDURE Report(n : INTEGER)\n   IF IsEven(n) THEN\n      OUTPUT n, " is even"\n   ELSE\n      OUTPUT n, " is odd"\n   ENDIF\nENDPROCEDURE\n\nDECLARE k : INTEGER\nFOR k <- 1 TO 5\n   CALL Report(k)\nNEXT k'
    },
    {
      id: 'as-params', level: 'AS', topic: 'Ch 14 · Subroutines',
      title: 'Passing Parameters (BYVAL / BYREF)',
      html:
        '<p>Parameters are passed <strong>by value</strong> by default — the subroutine works on a copy, so the caller\'s variable is unchanged. Pass <strong>by reference</strong> with <code>BYREF</code> so changes inside affect the caller\'s variable.</p>' +
        '<pre class="syntax">PROCEDURE Swap(BYREF X : INTEGER, Y : INTEGER)\n   ...\nENDPROCEDURE</pre>' +
        '<div class="tip"><strong>Exam tip:</strong> When several parameters share a mode the keyword need not be repeated — above, both X and Y are BYREF. Parameters should <em>not</em> be passed BYREF to a function.</div>',
      example:
        'PROCEDURE Swap(BYREF X : INTEGER, Y : INTEGER)\n   DECLARE Temp : INTEGER\n   Temp <- X\n   X <- Y\n   Y <- Temp\nENDPROCEDURE\n\nDECLARE a : INTEGER\nDECLARE b : INTEGER\na <- 5\nb <- 9\nCALL Swap(a, b)\nOUTPUT "a = ", a, ", b = ", b'
    },
    {
      id: 'as-builtins', level: 'AS', topic: 'Ch 14 · Built-in Functions',
      title: 'Built-in Functions & String Handling',
      html:
        '<p>9618 provides standard library functions (always given in the exam). String functions:</p>' +
        '<ul><li><code>LENGTH(s)</code> — number of characters</li>' +
        '<li><code>LEFT(s,n)</code> / <code>RIGHT(s,n)</code> — n characters from the start / end</li>' +
        '<li><code>MID(s,p,n)</code> — n characters from position p (positions count from 1)</li>' +
        '<li><code>UCASE(x)</code> / <code>LCASE(x)</code> — change case</li>' +
        '<li><code>ASC(ch)</code> / <code>CHR(n)</code> — character &harr; ASCII code</li>' +
        '<li><code>s[p]</code> — the single character at position p</li></ul>' +
        '<p>Numeric: <code>INT(x)</code> (integer part), <code>STRING_TO_NUM(s)</code>, and join strings with <code>&amp;</code>.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> String positions start at 1. <code>MID("ABCDEFGH", 2, 3)</code> returns <code>"BCD"</code>.</div>',
      example:
        'DECLARE s : STRING\ns <- "Cambridge"\nOUTPUT "Length: ", LENGTH(s)\nOUTPUT "First 4: ", LEFT(s, 4)\nOUTPUT "Mid(4,3): ", MID(s, 4, 3)\nOUTPUT "Upper: ", UCASE(s)\nOUTPUT "Char 1: ", s[1], " (ASCII ", ASC(s[1]), ")"'
    },

    /* ============================ A2 LEVEL ============================ */
    {
      id: 'a2-recursion', level: 'A2', topic: 'Ch 24 · Recursion',
      title: 'Recursion',
      html:
        '<p>A subroutine is <strong>recursive</strong> if it is defined in terms of itself. Every recursive solution needs:</p>' +
        '<ul><li>a <strong>base case</strong> — an explicit answer that stops the recursion;</li>' +
        '<li>a <strong>general case</strong> — defined in terms of itself, and it must move <em>towards</em> the base case each time.</li></ul>' +
        '<p>At run time the system uses a <strong>stack</strong> to store the return address and local values for each call, then unwinds them as each call returns.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Be ready to (a) trace recursion with a diagram/trace table, and (b) state benefits (clear, compact for naturally recursive problems) and drawbacks (stack memory, risk of stack overflow if the base case is never reached).</div>',
      example:
        'FUNCTION Factorial(n : INTEGER) RETURNS INTEGER\n   IF n <= 1 THEN\n      RETURN 1                 // base case\n   ELSE\n      RETURN n * Factorial(n - 1)   // general case\n   ENDIF\nENDFUNCTION\n\nDECLARE k : INTEGER\nFOR k <- 1 TO 6\n   OUTPUT k, "! = ", Factorial(k)\nNEXT k'
    },
    {
      id: 'a2-binsearch', level: 'A2', topic: 'Ch 23 · Algorithms',
      title: 'Binary Search',
      html:
        '<p>Binary search finds a value in a <strong>sorted</strong> array far faster than linear search. Each step halves the search range, so it is O(log n).</p>' +
        '<ol><li>Look at the middle element.</li>' +
        '<li>If it matches, stop. If the target is smaller, search the left half; if larger, search the right half.</li>' +
        '<li>Repeat until found or the range is empty.</li></ol>' +
        '<div class="tip"><strong>Exam tip:</strong> Binary search <em>requires</em> sorted data. Track two pointers, <code>Low</code> and <code>High</code>; the midpoint is <code>(Low + High) DIV 2</code>.</div>',
      example:
        'DECLARE A : ARRAY[1:8] OF INTEGER\nDECLARE i : INTEGER\nFOR i <- 1 TO 8\n   A[i] <- i * 2          // 2,4,6,...,16 (sorted)\nNEXT i\nDECLARE Target : INTEGER\nDECLARE Low : INTEGER\nDECLARE High : INTEGER\nDECLARE Mid : INTEGER\nDECLARE Found : BOOLEAN\nTarget <- 12\nLow <- 1\nHigh <- 8\nFound <- FALSE\nWHILE Low <= High AND Found = FALSE\n   Mid <- (Low + High) DIV 2\n   IF A[Mid] = Target THEN\n      Found <- TRUE\n      OUTPUT "Found at index ", Mid\n   ELSE\n      IF A[Mid] < Target THEN\n         Low <- Mid + 1\n      ELSE\n         High <- Mid - 1\n      ENDIF\n   ENDIF\nENDWHILE\nIF NOT Found THEN OUTPUT "Not found" ENDIF'
    },
    {
      id: 'a2-insertion', level: 'A2', topic: 'Ch 23 · Algorithms',
      title: 'Insertion Sort',
      html:
        '<p>Insertion sort builds a sorted section at the front of the array. It takes each new element and inserts it into its correct place among the already-sorted elements by shifting larger ones to the right.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Insertion sort is efficient on nearly-sorted data (close to O(n)); in the worst case it is O(n²), like bubble sort. Be able to compare the two.</div>',
      example:
        'DECLARE A : ARRAY[1:6] OF INTEGER\nDECLARE i : INTEGER\nDECLARE j : INTEGER\nDECLARE key : INTEGER\nA[1]<-5\nA[2]<-2\nA[3]<-9\nA[4]<-1\nA[5]<-6\nA[6]<-3\nFOR i <- 2 TO 6\n   key <- A[i]\n   j <- i - 1\n   WHILE j >= 1 AND A[j] > key\n      A[j+1] <- A[j]\n      j <- j - 1\n   ENDWHILE\n   A[j+1] <- key\nNEXT i\nFOR i <- 1 TO 6\n   OUTPUT A[i]\nNEXT i'
    },
    {
      id: 'a2-adt', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Abstract Data Types (ADTs)',
      html:
        '<p>An <strong>abstract data type</strong> defines a set of values and the operations on them, separately from how it is implemented. The syllabus ADTs are <strong>stack, queue, linked list, binary tree</strong> and <strong>dictionary</strong>.</p>' +
        '<p>When a language lacks an ADT, you build it from existing structures — typically an <code>ARRAY</code> of <code>records</code>, with integer "pointers" (indexes) linking the elements.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Know each ADT\'s behaviour: stack = LIFO, queue = FIFO, linked list = ordered chain you can insert into cheaply, tree = hierarchical, dictionary = key&rarr;value lookup.</div>',
      example:
        '// Using an array + a size pointer as a simple collection ADT\nDECLARE Items : ARRAY[1:10] OF STRING\nDECLARE Size : INTEGER\nSize <- 0\n// "Add" operation\nSize <- Size + 1\nItems[Size] <- "apple"\nSize <- Size + 1\nItems[Size] <- "pear"\n// "Report" operation\nDECLARE i : INTEGER\nFOR i <- 1 TO Size\n   OUTPUT i, ": ", Items[i]\nNEXT i'
    },
    {
      id: 'a2-stack', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Stacks (LIFO)',
      html:
        '<p>A <strong>stack</strong> is Last-In-First-Out. Implement it with an array and a <code>Top</code> pointer.</p>' +
        '<ul><li><strong>Push</strong>: increment <code>Top</code>, store the value (check for <em>overflow</em> first).</li>' +
        '<li><strong>Pop</strong>: read the value at <code>Top</code>, decrement <code>Top</code> (check for <em>underflow</em> first).</li></ul>' +
        '<div class="tip"><strong>Exam tip:</strong> An empty stack has <code>Top = 0</code>. Always check for overflow (full) when pushing and underflow (empty) when popping.</div>',
      example:
        'DECLARE Stack : ARRAY[1:5] OF INTEGER\nDECLARE Top : INTEGER\nDECLARE i : INTEGER\nTop <- 0\n// push 10, 20, 30\nFOR i <- 1 TO 3\n   IF Top < 5 THEN\n      Top <- Top + 1\n      Stack[Top] <- i * 10\n      OUTPUT "Pushed ", Stack[Top]\n   ENDIF\nNEXT i\n// pop everything (LIFO order)\nWHILE Top > 0\n   OUTPUT "Popped ", Stack[Top]\n   Top <- Top - 1\nENDWHILE'
    },
    {
      id: 'a2-queue', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Queues (FIFO)',
      html:
        '<p>A <strong>queue</strong> is First-In-First-Out. Use an array with two pointers, <code>Front</code> and <code>Rear</code>, and a <code>Count</code> of items. A <strong>circular queue</strong> wraps the pointers around with <code>MOD</code> so space is reused.</p>' +
        '<ul><li><strong>Enqueue</strong>: add at <code>Rear</code>, then advance <code>Rear</code>.</li>' +
        '<li><strong>Dequeue</strong>: remove at <code>Front</code>, then advance <code>Front</code>.</li></ul>' +
        '<div class="tip"><strong>Exam tip:</strong> Keep a <code>Count</code> so you can tell an empty queue (Count = 0) from a full one (Count = size) — with wrap-around the pointers alone are ambiguous.</div>',
      example:
        'CONSTANT MaxSize = 5\nDECLARE Q : ARRAY[1:5] OF INTEGER\nDECLARE Front : INTEGER\nDECLARE Rear : INTEGER\nDECLARE Count : INTEGER\nFront <- 1\nRear <- 0\nCount <- 0\nDECLARE i : INTEGER\n// enqueue 1,2,3\nFOR i <- 1 TO 3\n   Rear <- (Rear MOD MaxSize) + 1\n   Q[Rear] <- i\n   Count <- Count + 1\nNEXT i\n// dequeue all (FIFO)\nWHILE Count > 0\n   OUTPUT "Served ", Q[Front]\n   Front <- (Front MOD MaxSize) + 1\n   Count <- Count - 1\nENDWHILE'
    },
    {
      id: 'a2-linkedlist', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Linked Lists',
      html:
        '<p>A <strong>linked list</strong> is a chain of nodes; each node holds data and a pointer to the next node. Implement it as an <code>ARRAY OF</code> record, where the pointer is the <em>index</em> of the next node (0 means null / end).</p>' +
        '<p>A <code>Head</code> pointer marks the start. To traverse, follow the pointers until you reach 0. Inserting only changes a couple of pointers — no shifting of data.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Real implementations also keep a <em>free list</em> of unused nodes so you can allocate and reclaim nodes. Use 0 (or &minus;1) consistently as the null pointer.</div>',
      example:
        'TYPE Node\n   DECLARE Data : INTEGER\n   DECLARE Pointer : INTEGER   // index of the next node, 0 = end\nENDTYPE\n\nDECLARE List : ARRAY[1:3] OF Node\nDECLARE Head : INTEGER\n// build chain 10 -> 20 -> 30\nList[1].Data <- 10\nList[1].Pointer <- 2\nList[2].Data <- 20\nList[2].Pointer <- 3\nList[3].Data <- 30\nList[3].Pointer <- 0\nHead <- 1\n// traverse\nDECLARE Current : INTEGER\nCurrent <- Head\nWHILE Current <> 0\n   OUTPUT List[Current].Data\n   Current <- List[Current].Pointer\nENDWHILE'
    },
    {
      id: 'a2-tree', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Binary Trees',
      html:
        '<p>A <strong>binary search tree</strong> stores data so that, for every node, the left subtree holds smaller values and the right subtree holds larger values. Implement nodes as a record with <code>Data</code>, <code>Left</code> and <code>Right</code> index pointers.</p>' +
        '<p>An <strong>in-order traversal</strong> (left, node, right) visits the values in ascending order — and is naturally recursive.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> Know the three traversals: <em>in-order</em> (sorted output), <em>pre-order</em> (node first) and <em>post-order</em> (node last).</div>',
      example:
        'TYPE TreeNode\n   DECLARE Data : INTEGER\n   DECLARE Left : INTEGER\n   DECLARE Right : INTEGER\nENDTYPE\nDECLARE Tree : ARRAY[1:5] OF TreeNode\n// a small BST:        50\n//                    /  \\\n//                  30    70\n//                       /\n//                     60\nTree[1].Data<-50\nTree[1].Left<-2\nTree[1].Right<-3\nTree[2].Data<-30\nTree[2].Left<-0\nTree[2].Right<-0\nTree[3].Data<-70\nTree[3].Left<-4\nTree[3].Right<-0\nTree[4].Data<-60\nTree[4].Left<-0\nTree[4].Right<-0\n\nPROCEDURE InOrder(Root : INTEGER)\n   IF Root <> 0 THEN\n      CALL InOrder(Tree[Root].Left)\n      OUTPUT Tree[Root].Data\n      CALL InOrder(Tree[Root].Right)\n   ENDIF\nENDPROCEDURE\n\nCALL InOrder(1)'
    },
    {
      id: 'a2-hash', level: 'A2', topic: 'Ch 23 · Data Structures',
      title: 'Hash Tables & Dictionaries',
      html:
        '<p>A <strong>hash table</strong> stores items in an array at a position computed from the key by a <strong>hash function</strong> (e.g. <code>key MOD size</code>). This gives near-instant, O(1), lookup on average.</p>' +
        '<p>When two keys hash to the same slot — a <strong>collision</strong> — one simple fix is <em>linear probing</em>: move to the next free slot. A <strong>dictionary</strong> is the ADT that maps keys to values, often built on a hash table.</p>' +
        '<div class="tip"><strong>Exam tip:</strong> A good hash function spreads keys evenly to minimise collisions. Be able to describe at least one collision-handling method.</div>',
      example:

      prompt: '<p>A linked list is stored as an array of records with <code>Data</code> and <code>Pointer</code> fields. Read <code>n</code>, then <code>n</code> data values (store them so node <code>i</code> points to node <code>i+1</code>, and the last points to 0, with Head = 1). Then traverse from Head, outputting each value on its own line.</p>',
      starter: 'TYPE Node\n   DECLARE Data : INTEGER\n   DECLARE Pointer : INTEGER\nENDTYPE\nDECLARE List : ARRAY[1:100] OF Node\nDECLARE n : INTEGER\nDECLARE i : INTEGER\nDECLARE Head : INTEGER\nINPUT n\n// build the chain, set Head, then traverse\n',
      solution: 'TYPE Node\n   DECLARE Data : INTEGER\n   DECLARE Pointer : INTEGER\nENDTYPE\nDECLARE List : ARRAY[1:100] OF Node\nDECLARE n : INTEGER\nDECLARE i : INTEGER\nDECLARE Head : INTEGER\nINPUT n\nFOR i <- 1 TO n\n   INPUT List[i].Data\n   IF i < n THEN\n      List[i].Pointer <- i + 1\n   ELSE\n      List[i].Pointer <- 0\n   ENDIF\nNEXT i\nHead <- 1\nDECLARE Current : INTEGER\nCurrent <- Head\nWHILE Current <> 0\n   OUTPUT List[Current].Data\n   Current <- List[Current].Pointer\nENDWHILE',
      tests: [{ stdin: ['3','10','20','30'] }, { stdin: ['1','5'] }, { stdin: ['4','4','3','2','1'] }],
      hint: 'Node i links to i+1, except the last links to 0. Traverse with a Current pointer until it is 0.'
    }
  ];

  var CONTENT = { lessons: lessons, practice: practice };
  if (typeof module !== 'undefined' && module.exports) module.exports = CONTENT;
  global.PSEUDO_CONTENT = CONTENT;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===================== PseudoLab front-end ===================== */
(function () {
  'use strict';
  var E = window.PseudoEngine;
  var C = window.PSEUDO_CONTENT;
  var LS = window.localStorage;
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var ce = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* ---------------- syntax highlighter (display only) ---------------- */
  var HL_KW = ['DECLARE','CONSTANT','ARRAY','OF','IF','THEN','ELSE','ENDIF','CASE','OTHERWISE','ENDCASE',
    'FOR','TO','STEP','NEXT','WHILE','DO','ENDWHILE','REPEAT','UNTIL','PROCEDURE','ENDPROCEDURE','FUNCTION',
    'RETURNS','RETURN','ENDFUNCTION','CALL','BYREF','BYVAL','INPUT','OUTPUT','PRINT','TYPE','ENDTYPE','SET',
    'DEFINE','DIV','MOD','AND','OR','NOT','OPENFILE','READFILE','WRITEFILE','CLOSEFILE','SEEK','GETRECORD',
    'PUTRECORD','CLASS','ENDCLASS','INHERITS','PUBLIC','PRIVATE','NEW','SUPER','FOR','READ','WRITE','APPEND','RANDOM'];
  var HL_TYPE = ['INTEGER','REAL','CHAR','STRING','BOOLEAN','DATE'];
  var HL_FN = ['LENGTH','LEFT','RIGHT','MID','SUBSTRING','UCASE','LCASE','TO_UPPER','TO_LOWER','ASC','CHR',
    'INT','ROUND','RAND','RANDOM','DIV','MOD','EOF','NUM_TO_STR','STR_TO_NUM'];
  var KWset = {}, TYset = {}, FNset = {};
  HL_KW.forEach(function (k) { KWset[k] = 1; });
  HL_TYPE.forEach(function (k) { TYset[k] = 1; });
  HL_FN.forEach(function (k) { FNset[k] = 1; });

  function highlight(code) {
    var out = '', i = 0, n = code.length;
    function isW(c) { return /[A-Za-z0-9_]/.test(c); }
    while (i < n) {
      var c = code[i];
      // comment
      if (c === '/' && code[i + 1] === '/') {
        var j = i; while (j < n && code[j] !== '\n') j++;
        out += '<span class="t-com">' + esc(code.slice(i, j)) + '</span>'; i = j; continue;
      }
      // string
      if (c === '"') {
        var k = i + 1; while (k < n && code[k] !== '"' && code[k] !== '\n') k++;
        if (code[k] === '"') k++;
        out += '<span class="t-str">' + esc(code.slice(i, k)) + '</span>'; i = k; continue;
      }
      // char
      if (c === "'") {
        var m = i + 1; while (m < n && code[m] !== "'" && code[m] !== '\n') m++;
        if (code[m] === "'") m++;
        out += '<span class="t-str">' + esc(code.slice(i, m)) + '</span>'; i = m; continue;
      }
      // number
      if (c >= '0' && c <= '9') {
        var p = i; while (p < n && /[0-9.]/.test(code[p])) p++;
        out += '<span class="t-num">' + esc(code.slice(i, p)) + '</span>'; i = p; continue;
      }
      // word
      if (/[A-Za-z_]/.test(c)) {
        var q = i; while (q < n && isW(code[q])) q++;
        var w = code.slice(i, q), up = w.toUpperCase();
        // peek next non-space for '(' to detect function calls
        var r = q; while (r < n && code[r] === ' ') r++;
        var cls = '';
        if (up === 'TRUE' || up === 'FALSE') cls = 't-bool';
        else if (TYset[up]) cls = 't-type';
        else if (KWset[up]) cls = 't-kw';
        else if (FNset[up] && code[r] === '(') cls = 't-fn';
        else if (code[r] === '(') cls = 't-fn';
        out += cls ? '<span class="' + cls + '">' + esc(w) + '</span>' : esc(w);
        i = q; continue;
      }
      // assignment <- or <--
      if (c === '<' && code[i + 1] === '-') {
        var len = code[i + 2] === '-' ? 3 : 2;
        out += '<span class="t-op">' + esc(code.substr(i, len)) + '</span>'; i += len; continue;
      }
      if ('+-*/=<>&^:.,()[]'.indexOf(c) !== -1) {
        out += '<span class="t-op">' + esc(c) + '</span>'; i++; continue;
      }
      out += esc(c); i++;
    }
    return out + '\n';
  }

  /* ---------------- code editor widget ---------------- */
  function CodeEditor(host, opts) {
    opts = opts || {};
    this.host = host;
    host.classList.add('editor');
    host.innerHTML = '';
    this.gutter = ce('div', 'gutter');
    this.wrap = ce('div', 'code-wrap');
    this.pre = ce('pre', 'hl'); this.code = ce('code'); this.pre.appendChild(this.code);
    this.ta = ce('textarea'); this.ta.setAttribute('spellcheck', 'false');
    this.ta.setAttribute('wrap', 'off'); this.ta.setAttribute('autocapitalize', 'off');
    this.ta.setAttribute('autocomplete', 'off'); this.ta.setAttribute('autocorrect', 'off');
    if (opts.placeholder) this.ta.placeholder = opts.placeholder;
    this.wrap.appendChild(this.pre); this.wrap.appendChild(this.ta);
    host.appendChild(this.gutter); host.appendChild(this.wrap);
    this.onRun = opts.onRun; this.onChange = opts.onChange;
    var self = this;
    this.ta.addEventListener('input', function () { self.render(); if (self.onChange) self.onChange(self.getValue()); });
    this.ta.addEventListener('scroll', function () {
      self.pre.scrollTop = self.ta.scrollTop; self.pre.scrollLeft = self.ta.scrollLeft;
      self.gutter.scrollTop = self.ta.scrollTop;
    });
    this.ta.addEventListener('keydown', function (e) { self.onKey(e); });
    this.setValue(opts.value || '');
  }
  CodeEditor.prototype.getValue = function () { return this.ta.value; };
  CodeEditor.prototype.setValue = function (v) { this.ta.value = v; this.render(); };
  CodeEditor.prototype.focus = function () { this.ta.focus(); };
  CodeEditor.prototype.render = function () {
    var v = this.ta.value;
    this.code.innerHTML = highlight(v);
    var lines = v.split('\n').length;
    var g = ''; for (var i = 1; i <= lines; i++) g += i + '\n';
    this.gutter.textContent = g;
    this.pre.scrollTop = this.ta.scrollTop; this.pre.scrollLeft = this.ta.scrollLeft;
  };
  CodeEditor.prototype.onKey = function (e) {
    var ta = this.ta;
    // run shortcut
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); if (this.onRun) this.onRun(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = ta.selectionStart, en = ta.selectionEnd, val = ta.value;
      if (s !== en && val.slice(s, en).indexOf('\n') !== -1) {
        // indent selected lines
        var ls = val.lastIndexOf('\n', s - 1) + 1;
        var block = val.slice(ls, en);
        var indented = block.replace(/^/gm, '   ');
        ta.value = val.slice(0, ls) + indented + val.slice(en);
        ta.selectionStart = s + 3; ta.selectionEnd = en + (indented.length - block.length);
      } else {
        ta.value = val.slice(0, s) + '   ' + val.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 3;
      }
      this.render(); if (this.onChange) this.onChange(this.getValue()); return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      var p = ta.selectionStart, value = ta.value;
      var lineStart = value.lastIndexOf('\n', p - 1) + 1;
      var line = value.slice(lineStart, p);
      var indent = (line.match(/^\s*/) || [''])[0];
      var trimmed = line.trim().toUpperCase();
      var extra = '';
      if (/\bTHEN$/.test(trimmed) || trimmed === 'ELSE' || /\bDO$/.test(trimmed) || trimmed === 'REPEAT' ||
          /^FOR\b/.test(trimmed) || /^WHILE\b/.test(trimmed) || /^PROCEDURE\b/.test(trimmed) ||
          /^FUNCTION\b/.test(trimmed) || /^CASE OF\b/.test(trimmed) || /^CLASS\b/.test(trimmed) ||
          /^TYPE\b/.test(trimmed) || trimmed.indexOf('OTHERWISE') === 0 || /:$/.test(trimmed)) extra = '   ';
      var ins = '\n' + indent + extra;
      ta.value = value.slice(0, p) + ins + value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = p + ins.length;
      this.render(); if (this.onChange) this.onChange(this.getValue());
      ta.scrollTop = ta.scrollTop; this.pre.scrollTop = ta.scrollTop; return;
    }
  };

  /* ---------------- runner ---------------- */
  function parseFiles(text) {
    var files = {}, cur = null, lines = (text || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^###\s+(.+?)\s*$/);
      if (m) { cur = m[1]; files[cur] = []; }
      else if (cur != null) files[cur].push(lines[i]);
    }
    var out = {}; for (var k in files) if (files.hasOwnProperty(k)) out[k] = files[k].join('\n');
    return out;
  }
  function inputQueue(text) {
    if (text == null || text === '') return [];
    return text.replace(/\n$/, '').split('\n');
  }
  function execute(source, stdinText, filesText) {
    var q = inputQueue(stdinText);
    var events = [];
    var r = E.run(source, {
      output: function (s) { events.push({ kind: 'out', text: s }); },
      input: function () { return q.length ? q.shift() : null; },
      files: parseFiles(filesText),
      maxSteps: 1500000
    });
    if (!r.ok && r.error) events.push({ kind: 'err', text: 'Error' + (r.error.line ? ' (line ' + r.error.line + ')' : '') + ': ' + r.error.message });
    return { ok: r.ok, events: events, error: r.error };
  }
  function renderConsole(pre, events, footer) {
    pre.innerHTML = '';
    var frag = document.createDocumentFragment();
    events.forEach(function (ev) {
      if (ev.kind === 'err') { var s = ce('span', 'ln-err'); s.textContent = ev.text; frag.appendChild(s); frag.appendChild(document.createTextNode('\n')); }
      else if (ev.kind === 'info') { var s2 = ce('span', 'ln-info'); s2.textContent = ev.text; frag.appendChild(s2); frag.appendChild(document.createTextNode('\n')); }
      else { frag.appendChild(document.createTextNode(ev.text + '\n')); }
    });
    if (footer) { var f = ce('span', 'ln-info'); f.textContent = footer; frag.appendChild(f); }
    pre.appendChild(frag);
    pre.scrollTop = pre.scrollHeight;
  }
  function gradeNormalize(text) {
    return text.split('\n').map(function (l) { return l.replace(/\s+$/, ''); }).join('\n').replace(/\n+$/, '');
  }
  function outputText(events) { return events.filter(function (e) { return e.kind === 'out'; }).map(function (e) { return e.text; }).join('\n'); }

  /* ---------------- tab switching ---------------- */
  function switchView(name) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].dataset.view === name);
    ['editor', 'learn', 'practice', 'reference'].forEach(function (v) {
      $('#view-' + v).classList.toggle('active', v === name);
    });
    if (name === 'editor' && window.__playground) window.__playground.focus();
  }

  /* ============================ PLAYGROUND ============================ */
  var DEFAULT_CODE =
    '// Welcome to PseudoLab — a CIE pseudocode editor.\n' +

    'DECLARE Name : STRING\n' +
    'OUTPUT "What is your name?"\n' +

    'DECLARE i : INTEGER\n' +

  function buildPlayground() {

        '</div>' +

          '<div class="io-tabs">' +

    var saved = LS.getItem('pg.code');

      });
    });

    // examples dropdown
    var sel = $('#pg-examples');
    ['AS', 'A2'].forEach(function (lvl) {
      var og = ce('optgroup'); og.label = lvl + ' examples';
      C.lessons.filter(function (l) { return l.level === lvl; }).forEach(function (l) {

      renderConsole($('#pg-console'), res.events, res.ok ? '▸ finished' : '▸ stopped with an error');
    }
    $('#pg-run').addEventListener('click', runPg);
    $('#pg-clear').addEventListener('click', function () { $('#pg-console').innerHTML = ''; });

  /* ============================ LEARN ============================ */

      '<div class="q-prompt">' + q.prompt + '</div>' +
      '<div class="toolbar" style="background:transparent;border:none;padding:0 0 10px 0">' +
        '<button class="btn primary" id="pr-check">✓ Check answer</button>' +
        '<button class="btn" id="pr-run">▶ Run</button>' +
        '<button class="btn ghost" id="pr-hint">💡 Hint</button>' +
        '<button class="btn ghost" id="pr-sol">Show solution</button>' +
        '<button class="btn ghost" id="pr-reset">Reset</button>' +
      '</div>' +
      '<div class="practice-editor-wrap"><div id="pr-editor" style="flex:1;min-height:0;"></div></div>' +
      '<div class="io-tabs" style="margin-top:10px;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0">' +
        '<button class="io-tab active" data-pio="out">Output</button>' +
        '<button class="io-tab" data-pio="in">Input (for manual Run)</button>' +
      '</div>' +
      '<div class="pio-panel" data-pio="out" style="border:1px solid var(--border);border-radius:0 0 8px 8px"><pre class="console" id="pr-console" style="max-height:200px"></pre></div>' +
      '<div class="pio-panel" data-pio="in" style="display:none;border:1px solid var(--border);border-radius:0 0 8px 8px"><textarea class="io-area" id="pr-input" style="min-height:120px" placeholder="One value per line"></textarea></div>' +
      '<div class="hint-box" id="pr-hintbox">' + esc(q.hint || 'Think about which construct fits, then build it step by step.') + '</div>' +
      '<div class="solution-box" id="pr-solbox"><strong>Model solution</strong><pre><code>' + highlight(q.solution) + '</code></pre></div>' +
      '<div class="grade-result" id="pr-grade"></div>';
    box.scrollTop = 0;

    var attempt = getAttempt(id);
    pracState.editor = new CodeEditor($('#pr-editor'), {
      value: attempt != null ? attempt : q.starter,
      onRun: doRun,
      onChange: function (v) { saveAttempt(id, v); }
    });

    box.querySelectorAll('.io-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        box.querySelectorAll('.io-tab').forEach(function (x) { x.classList.toggle('active', x === t); });
        box.querySelectorAll('.pio-panel').forEach(function (p) { p.style.display = (p.dataset.pio === t.dataset.pio) ? 'block' : 'none'; });
      });
    });

    function doRun() {
      var res = execute(pracState.editor.getValue() + (q.append || ''), $('#pr-input').value, '');
      renderConsole($('#pr-console'), res.events, res.ok ? '▸ finished' : '▸ error');
    }
    $('#pr-run').addEventListener('click', doRun);
    $('#pr-hint').addEventListener('click', function () { $('#pr-hintbox').classList.toggle('show'); });
    $('#pr-sol').addEventListener('click', function () {
      var sb = $('#pr-solbox');
      if (!sb.classList.contains('show')) { if (!confirm('Reveal the model solution?')) return; }
      sb.classList.toggle('show');
    });
    $('#pr-reset').addEventListener('click', function () {
      if (confirm('Reset your code to the starter?')) { pracState.editor.setValue(q.starter); saveAttempt(id, q.starter); }
    });
    $('#pr-check').addEventListener('click', function () { gradeQuestion(q); });
  }

  function gradeQuestion(q) {
    var userCode = pracState.editor.getValue() + (q.append || '');
    var solCode = q.solution + (q.append || '');
    var tests = q.tests || [];
    var grade = $('#pr-grade');
    if (!tests.length) {
      grade.className = 'grade-result show';
      grade.innerHTML = '<div class="grade-banner ok">This task is open-ended — compare your output with the model solution.</div>';
      return;
    }
    var rows = '', allPass = true, firstFail = null;
    for (var i = 0; i < tests.length; i++) {
      var t = tests[i];
      var exp = execute(solCode, (t.stdin || []).join('\n'), '');
      var act = execute(userCode, (t.stdin || []).join('\n'), '');
      var expOut = gradeNormalize(outputText(exp.events));
      var actOut = act.ok ? gradeNormalize(outputText(act.events)) : '__ERROR__';
      var ok = act.ok && expOut === actOut;
      if (!ok && !firstFail) firstFail = { t: t, exp: expOut, act: act.ok ? actOut : ('(error) ' + (act.error ? act.error.message : '')), inp: (t.stdin || []).join(', ') };
      if (!ok) allPass = false;
      rows += '<div class="case-row"><span class="' + (ok ? 'res-ok' : 'res-bad') + '">' + (ok ? '✓ PASS' : '✗ FAIL') + '</span>' +
        '<span style="color:var(--text-faint)">input:</span> <span>' + esc((t.stdin || []).join(', ') || '(none)') + '</span></div>';
    }
    grade.className = 'grade-result show';
    var banner = allPass
      ? '<div class="grade-banner ok">🎉 All ' + tests.length + ' test cases passed. Well done!</div>'
      : '<div class="grade-banner bad">Not yet — ' + (tests.filter ? '' : '') + 'some test cases failed.</div>';
    var diff = '';
    if (!allPass && firstFail) {
      diff = '<div class="diff-box"><div class="lbl">First failing case — input: ' + esc(firstFail.inp || '(none)') + '</div>' +
        '<div class="lbl" style="margin-top:6px">Expected output:</div>' + esc(firstFail.exp || '(empty)') +
        '<div class="lbl" style="margin-top:6px">Your output:</div>' + esc(firstFail.act || '(empty)') + '</div>';
    }
    grade.innerHTML = banner + '<div class="grade-cases">' + rows + diff + '</div>';
    if (allPass) { markSolved(q.id); renderPracNav(); }
  }

  /* ============================ REFERENCE ============================ */
  function buildReference() {
    var view = $('#view-reference');
    var cards = [
      { h: 'Data types', rows: [['INTEGER', 'whole number, e.g. 5, -3'], ['REAL', 'fractional, e.g. 4.7, -0.5'], ['CHAR', "single char 'A'"], ['STRING', 'text "hello"'], ['BOOLEAN', 'TRUE / FALSE'], ['DATE', 'dd/mm/yyyy (A Level)']] },
      { h: 'Assignment & I/O', rows: [['x <- v', 'assign (← )'], ['DECLARE x : T', 'declare variable'], ['CONSTANT k = v', 'constant'], ['INPUT x', 'read a value'], ['OUTPUT a, b', 'print values']] },
      { h: 'Operators', rows: [['+  -  *  /', 'arithmetic ( / → REAL )'], ['DIV  MOD', 'integer ÷ and remainder'], ['=  <>  <  <=  >  >=', 'comparison → BOOLEAN'], ['AND  OR  NOT', 'logic'], ['&', 'string concatenation']] },
      { h: 'Selection', rows: [['IF…THEN…ELSE…ENDIF', 'two-way choice'], ['CASE OF x … ENDCASE', 'multi-way'], ['v1 TO v2 :', 'range in CASE'], ['OTHERWISE :', 'default branch']] },
      { h: 'Iteration', rows: [['FOR i <- a TO b … NEXT i', 'count-controlled'], ['STEP n', 'increment (may be -)'], ['WHILE c [DO] … ENDWHILE', 'pre-condition'], ['REPEAT … UNTIL c', 'post-condition']] },
      { h: 'Subroutines', rows: [['PROCEDURE p(...) … ENDPROCEDURE', 'no return'], ['CALL p(...)', 'call procedure'], ['FUNCTION f(...) RETURNS T', 'returns a value'], ['RETURN v', 'return from function'], ['BYREF / BYVAL', 'parameter passing']] },
      { h: 'String functions', rows: [['LENGTH(s)', 'number of chars'], ['LEFT(s,n) / RIGHT(s,n)', 'n chars from start / end'], ['MID(s,p,n)', 'n chars from position p'], ['UCASE(x) / LCASE(x)', 'change case'], ['s[p]', 'char at position p (from 1)']] },
      { h: 'Numeric functions', rows: [['INT(x)', 'integer part (truncate)'], ['STRING_TO_NUM(s)', 'string → number'], ['ASC(c) / CHR(n)', 'char ↔ ASCII code'], ['x DIV y / x MOD y', 'integer ÷ and remainder'], ['RAND(x)', '0 ≤ r < x']] },
      { h: 'Arrays & records', rows: [['ARRAY[1:n] OF T', '1-D array'], ['ARRAY[1:r,1:c] OF T', '2-D array'], ['TYPE R … ENDTYPE', 'record'], ['x.field', 'field access'], ['TYPE C = (A,B,C)', 'enumerated']] },
      { h: 'File handling', rows: [['OPENFILE "f" FOR READ', 'text: open to read'], ['READFILE / WRITEFILE', 'read / write a line'], ['EOF("f")', 'end of file?'], ['OPENFILE "f" FOR RANDOM', 'random-access file'], ['SEEK / GETRECORD / PUTRECORD', 'direct record access']] },
      { h: 'OOP (A2)', rows: [['CLASS C … ENDCLASS', 'define class'], ['PROCEDURE NEW(...)', 'constructor'], ['o <- NEW C(...)', 'create object'], ['CLASS D INHERITS C', 'inheritance'], ['SUPER.NEW(...)', 'parent constructor']] },
      { h: 'AS vs A2 topics', rows: [['AS', 'constructs, arrays, records'], ['AS', 'text files, procedures/functions'], ['A2', 'recursion'], ['A2', 'ADTs: stack/queue/list/tree'], ['A2', 'random files, OOP']] }
    ];
    var html = '<div class="content-inner" style="max-width:1100px"><div class="eyebrow">Quick reference</div><h1>Pseudocode Cheat-Sheet</h1>' +
      '<p style="color:var(--text-dim)">Cambridge International AS &amp; A Level Computer Science (9618) pseudocode.</p><div class="ref-grid">';
    cards.forEach(function (c) {
      html += '<div class="ref-card"><h3>' + esc(c.h) + '</h3><table>';
      c.rows.forEach(function (r) { html += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; });
      html += '</table></div>';
    });
    html += '</div></div>';
    view.innerHTML = html;
  }

  /* ---------------- shared: level filter ---------------- */
  function buildLevelFilter(host, state, onChange) {
    host.innerHTML = '';
    ['All', 'AS', 'A2'].forEach(function (lvl) {
      var c = ce('button', 'chip' + (state.level === lvl ? ' active' : '')); c.textContent = lvl;
      c.addEventListener('click', function () {
        state.level = lvl;
        host.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('active', x.textContent === lvl); });
        onChange();
      });
      host.appendChild(c);
    });
  }

  /* ---------------- theme ---------------- */
  function initTheme() {
    var t = LS.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    $('#themeToggle').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur); LS.setItem('theme', cur);
    });
  }

  /* ---------------- init ---------------- */
  function init() {
    initTheme();
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () { switchView(t.dataset.view); });
    });
    buildPlayground();
    buildLearn();
    buildPractice();
    buildReference();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
